{{- /*
  AWS EKS Auto Mode: an Ingress handled by the Auto Mode load balancing capability.
  Auto Mode creates and manages the Application Load Balancer itself; nothing to install.
  IngressClassParams and IngressClass are cluster-scoped and named after the release.
  With access.host + access.alb.certificateArns the app is served on our own domain over HTTPS.
*/}}
{{- if eq .Values.access.mode "alb-ingress" }}
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: {{ .Release.Name }}-alb
  labels:
    {{- include "railshack.labels" (dict "name" "frontend" "lang" "node" "root" $) | nindent 4 }}
spec:
  scheme: {{ .Values.access.alb.scheme }}
  group:
    name: {{ .Release.Name }}       # every Ingress of this class shares ONE ALB (the app and Grafana)
  {{- with .Values.access.alb.certificateArns }}
  certificateARNs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: {{ .Release.Name }}-alb
  labels:
    {{- include "railshack.labels" (dict "name" "frontend" "lang" "node" "root" $) | nindent 4 }}
spec:
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: {{ .Release.Name }}-alb
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: railshack
  labels:
    {{- include "railshack.labels" (dict "name" "frontend" "lang" "node" "root" $) | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/target-type: ip                 # send traffic straight to the frontend pods
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    {{- if .Values.access.alb.certificateArns }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    {{- end }}
spec:
  ingressClassName: {{ .Release.Name }}-alb
  rules:
    - {{- with .Values.access.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { name: internal }
{{- end }}
