# The RailShack Grafana dashboards: one ConfigMap per file in helm/railshack/dashboards/.
# Grafana's sidecar (kube-prometheus-stack, cluster/monitoring-values.yaml) loads every ConfigMap
# labelled grafana_dashboard=1 automatically, into the folder named by the grafana_folder annotation.
{{- if .Values.grafanaDashboard.enabled }}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
{{- $name := base $path | trimSuffix ".json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: railshack-dashboard-{{ $name }}
  labels:
    grafana_dashboard: "1"
    {{- include "railshack.labels" (dict "name" "grafana-dashboard" "lang" "infra" "root" $) | nindent 4 }}
  annotations:
    grafana_folder: {{ $.Values.grafanaDashboard.folder | quote }}
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
