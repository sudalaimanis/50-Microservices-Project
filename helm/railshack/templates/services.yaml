{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "railshack.labels" (dict "name" $name "lang" $svc.lang "root" $) | nindent 4 }}
  {{- if and (eq $name "frontend") $.Values.frontend.service.annotations }}
  annotations:
    {{- toYaml $.Values.frontend.service.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if eq $name "frontend" }}
  type: {{ ternary "LoadBalancer" $.Values.frontend.service.type (eq $.Values.access.mode "loadbalancer") }}
  ports:
    - name: http
      port: {{ $.Values.frontend.service.port }}
      targetPort: http
      {{- if and (eq $.Values.frontend.service.type "NodePort") $.Values.frontend.service.nodePort }}
      nodePort: {{ $.Values.frontend.service.nodePort }}
      {{- end }}
    - { name: internal, port: 8080, targetPort: http }
  {{- else }}
  type: ClusterIP
  ports:
    - { name: http, port: 8080, targetPort: http }
  {{- end }}
  selector:
    {{- include "railshack.selector" (dict "name" $name "root" $) | nindent 4 }}
{{- end }}
