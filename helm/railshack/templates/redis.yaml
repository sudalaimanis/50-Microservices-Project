{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "railshack.labels" (dict "name" "redis" "lang" "infra" "root" $) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "railshack.selector" (dict "name" "redis" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "railshack.labels" (dict "name" "redis" "lang" "infra" "root" $) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--save", "", "--appendonly", "no", "--maxmemory", {{ .Values.redis.maxMemory | quote }}, "--maxmemory-policy", "allkeys-lru"]  # a cache: when full, drop the least recently used keys
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe: { tcpSocket: { port: redis }, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: redis }, periodSeconds: 10 }
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: data, mountPath: /data }]
        {{- if .Values.redis.metrics.enabled }}
        # Sidecar: reads Redis INFO (hits, misses, keys, memory, evictions) and publishes it on :9121/metrics.
        - name: metrics
          image: {{ .Values.redis.metrics.image }}
          ports: [{ name: metrics, containerPort: 9121 }]
          env:
            - { name: REDIS_ADDR, value: "redis://127.0.0.1:6379" }
          readinessProbe: { httpGet: { path: /metrics, port: metrics }, periodSeconds: 15, timeoutSeconds: 5 }
          resources:
            {{- toYaml .Values.redis.metrics.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
        {{- end }}
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "railshack.labels" (dict "name" "redis" "lang" "infra" "root" $) | nindent 4 }}
spec:
  ports:
    - { name: redis, port: 6379, targetPort: redis }
    {{- if .Values.redis.metrics.enabled }}
    - { name: metrics, port: 9121, targetPort: metrics }
    {{- end }}
  selector:
    {{- include "railshack.selector" (dict "name" "redis" "root" $) | nindent 4 }}
{{- end }}
