# The key auth signs login tokens with. Generated once on first install and kept on upgrades,
# so users stay signed in across deployments. Set auth.secret to choose your own.
{{- $existing := lookup "v1" "Secret" .Release.Namespace "railshack-auth" }}
apiVersion: v1
kind: Secret
metadata:
  name: railshack-auth
  labels:
    {{- include "railshack.labels" (dict "name" "auth" "lang" "go" "root" $) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.auth.secret }}
  AUTH_SECRET: {{ .Values.auth.secret | b64enc | quote }}
  {{- else if $existing }}
  AUTH_SECRET: {{ index $existing.data "AUTH_SECRET" | quote }}
  {{- else }}
  AUTH_SECRET: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
