# Runs the Black Friday load test inside the cluster, from 10 k6 pods at once.
#   kubectl create configmap k6-script -n railshack --from-file=loadtest/blackfriday.js --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -f loadtest/k6-job.yaml
#   kubectl logs -n railshack -l job-name=blackfriday-load -f --max-log-requests 10
#   kubectl delete job blackfriday-load -n railshack      (stop early / clean up)
apiVersion: batch/v1
kind: Job
metadata:
  name: blackfriday-load
  namespace: railshack
spec:
  parallelism: 10
  completions: 10
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blackfriday-load
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:latest
          args: ["run", "--quiet", "/scripts/blackfriday.js"]
          env:
            - { name: BASE_URL, value: "http://frontend:8080" }
            - { name: PEAK_VUS, value: "400" }   # per pod → 4,000 virtual shoppers in total
            - { name: HOLD, value: "6m" }
          resources:
            requests: { cpu: 500m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: script, mountPath: /scripts }
      volumes:
        - name: script
          configMap: { name: k6-script }
